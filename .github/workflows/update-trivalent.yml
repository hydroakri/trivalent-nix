name: update-trivalent

# Unattended: detect a new Trivalent release -> verify it (3 layers, live) ->
# rewrite pins.nix -> PR -> nix flake check gates -> auto-merge on green.
# F1 events (key / Sigstore trusted-root change) HALT to a GitHub issue and
# never touch pins.nix. No binary cache -- the package is a repack of a
# prebuilt RPM, so consumers build it locally in minutes.
#
# Repo prerequisites (see MAINTENANCE.md "Repository setup"):
#   - secret GH_TOKEN_FOR_UPDATES (PAT: contents:write + pull-requests:write)
#   - Settings > General > "Allow auto-merge" enabled
#   - branch-protection rule on main requiring the `ci` status check
#   - labels: automated, dependencies, blocked, security, needs-human-approval

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

concurrency:
  group: update-trivalent
  cancel-in-progress: true

permissions:
  contents: read

env:
  GH_TOKEN: ${{ secrets.GH_TOKEN_FOR_UPDATES }}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Require GH_TOKEN_FOR_UPDATES
        run: |
          [ -n "$GH_TOKEN" ] || {
            echo "::error::secret GH_TOKEN_FOR_UPDATES is not set -- this workflow cannot open/merge PRs. See the workflow header."
            exit 1
          }

      - run: |
          gh auth setup-git
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: DeterminateSystems/determinate-nix-action@v3

      - name: Run the updater
        id: update
        run: |
          set +e
          # write the JSON outside the work tree so it never shows up in
          # `git status` and trips the working-tree guard below
          nix run .#update > "$RUNNER_TEMP/update.json"
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/update.json"

      - name: Classify the outcome
        id: outcome
        run: |
          rc="${{ steps.update.outputs.rc }}"
          # rc 42 = a self-certified key rotation -- PROPOSE, never auto-merge
          if [ "$rc" = "42" ]; then
            echo "kind=key-rotation" >> "$GITHUB_OUTPUT"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$rc" != "0" ]; then
            case "$rc" in
              20) reason="F3: repodata advertises a release GitHub never published" ;;
              22) reason="version map unparseable" ;;
              30) reason="F2: SLSA provenance format changed" ;;
              40) reason="F1: signing key changed, evidence incomplete -- fully manual" ;;
              41) reason="Sigstore trusted root does not match its pin" ;;
              1[123]) reason="a supply-chain verification layer failed" ;;
              *) reason="updater exited $rc" ;;
            esac
            title="trivalent auto-update HALTED: $reason"
            body="$(cat HALT.txt 2>/dev/null || echo "$reason")"
            num="$(gh issue list --state open --label blocked --search "in:title \"$title\"" --json number --jq '.[0].number')"
            if [ -n "$num" ]; then
              gh issue comment "$num" --body "Recurred on $(date -u +%FT%TZ). $body"
            else
              gh issue create --title "$title" --label blocked --label security --body "$body"
            fi
            exit 1
          fi
          # rc 0: bump or no-op
          if [ -z "$(git status --porcelain)" ]; then
            echo "no-op -- nothing to do"; echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "kind=version" >> "$GITHUB_OUTPUT"
          # working-tree guard: a version bump may only touch these.
          # `git status --porcelain` is `XY <path>` -- 2 status cols + a space --
          # for both ` M` (tracked, modified) and `??` (untracked, e.g. a new
          # verify/logs/<v> dir), so anchor on `^.{3}` not `^.M? `.
          if git status --porcelain | grep -vE '^.{3}(pins\.nix|verify/logs/)' ; then
            echo "::error::updater changed files it must not for a version bump"
            git checkout -- . && git clean -fd
            exit 1
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"
          echo "NEW=$(sed -n 's/.*versionRelease = "\([^"]*\)".*/\1/p' pins.nix | head -1)" >> "$GITHUB_OUTPUT"

      - name: Guard the key-rotation working tree
        if: steps.outcome.outputs.kind == 'key-rotation'
        run: |
          if git status --porcelain | grep -vE '^.{3}(verify/fingerprint\.env|pins\.nix|KEY-PROVENANCE\.md)$' ; then
            echo "::error::key-rotation touched files it must not"
            git checkout -- . && git clean -fd
            exit 1
          fi

      - name: Pre-PR validation
        if: steps.outcome.outputs.proceed == 'true'
        run: |
          nix flake check --print-build-logs
          nix build .#trivalent .#supply-chain --print-build-logs

      - name: Open PR
        id: pr
        if: steps.outcome.outputs.proceed == 'true'
        run: |
          U="$RUNNER_TEMP/update.json"
          msg="$(jq -r '.[0].commitMessage' "$U")"
          body="$(jq -r '.[0].commitBody' "$U")"
          mapfile -t files < <(jq -r '.[0].files[]' "$U")
          if [ "${{ steps.outcome.outputs.kind }}" = "key-rotation" ]; then
            new8="$(jq -r '.[0].newVersion' "$U" | cut -c1-8)"
            BR="bot/key-rotation-$new8"
            labels=(--label automated --label security --label needs-human-approval)
          else
            NEW="${{ steps.outcome.outputs.NEW }}"
            BR="bot/trivalent-$NEW"
            labels=(--label automated --label dependencies)
          fi
          git push origin --delete "$BR" 2>/dev/null || true
          git checkout -B "$BR"
          git add "${files[@]}"
          git commit -m "$msg" -m "$body"
          git push -u origin "$BR"
          PR="$(gh pr create --base main --head "$BR" --title "$msg" "${labels[@]}" --body "$body")"
          echo "pr_number=$(gh pr view "$PR" --json number --jq .number)" >> "$GITHUB_OUTPUT"
          echo "branch=$BR" >> "$GITHUB_OUTPUT"

      - name: Wait for CI, merge or roll back
        id: merge
        if: steps.pr.outputs.pr_number != '' && steps.outcome.outputs.kind != 'key-rotation'
        run: |
          PR="${{ steps.pr.outputs.pr_number }}"
          BR="${{ steps.pr.outputs.branch }}"
          for _ in $(seq 60); do
            gh pr checks "$PR" >/dev/null 2>&1 && break || sleep 10
          done
          if timeout 21600 gh pr checks "$PR" --watch --interval 60; then
            ok=false
            for _ in 1 2 3; do
              gh pr merge "$PR" --squash --delete-branch && { ok=true; break; } || sleep 30
            done
            if [ "$ok" != true ]; then
              echo "::error::merge kept failing -- PR $PR left open"; exit 1
            fi
          else
            echo "::error::CI failed or timed out -- rolling back"
            gh pr close "$PR" --comment "CI red; closing automatically. main keeps the previous pins.nix."
            git push origin --delete "$BR" 2>/dev/null || true
            exit 1
          fi
