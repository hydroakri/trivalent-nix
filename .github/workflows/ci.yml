name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: DeterminateSystems/determinate-nix-action@v3

      # the merge gate: pure 3-layer verification (checks.supply-chain) +
      # nixpkgs-drift installCheckPhase (checks.trivalent) + formatting
      - run: nix flake check --print-build-logs

      - run: nix build .#trivalent .#supply-chain --print-build-logs

      # independent review layer -- fingerprint drift (R1) + trusted-root pin (R4)
      - run: ./verify/40-review.sh
