name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: DeterminateSystems/determinate-nix-action@v3

      # the merge gate: pure 3-layer verification (checks.supply-chain) +
      # nixpkgs-drift installCheckPhase (checks.trivalent) + formatting
      - run: nix flake check --print-build-logs

      - run: nix build .#trivalent .#supply-chain --print-build-logs

      # independent review layer -- fingerprint drift (R1) + trusted-root pin (R4)
      - run: ./verify/40-review.sh

      - name: F5 sandbox parity (informational)
        continue-on-error: true
        run: |
          # ubuntu-24.04 restricts unprivileged user namespaces for unconfined
          # binaries -- Chromium's namespace sandbox needs them.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          nix build .#trivalent -o result --print-build-logs
          TRIVALENT_BIN=./result/bin/trivalent ./verify/30-sandbox-selfcheck.sh https://example.org

  # aarch64 on a real GitHub-hosted arm runner (public repo -> free). REQUIRED,
  # same tier as `ci-x86_64`: `nix flake check` here checks aarch64-only (no
  # --all-systems), so it's the aarch64 half of the merge gate. Identical steps
  # to `ci-x86_64` -- the F5 sandbox-parity self-check is the one that most needs
  # a native arm runner (README "aarch64").
  ci-aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: DeterminateSystems/determinate-nix-action@v3

      - run: nix flake check --print-build-logs

      - run: nix build .#trivalent .#supply-chain --print-build-logs

      - run: ./verify/40-review.sh

      - name: F5 sandbox parity (informational)
        continue-on-error: true
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          nix build .#trivalent -o result --print-build-logs
          TRIVALENT_BIN=./result/bin/trivalent ./verify/30-sandbox-selfcheck.sh https://example.org

  # Non-blocking signal: does .#trivalent build against nixpkgs other than the
  # one in flake.lock? NOT a required check -- the primary target is
  # unstable-following consumers and glibcStrategy = "fedora-rpm" is
  # nixpkgs-version-independent. `nixos-unstable` here is HEAD (ahead of the
  # lock -> catches drift a day before update-flake-lock.yml); the stable
  # channel is the release-following consumer path (bump at each NixOS release).
  matrix-nixpkgs:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        channel: [nixos-unstable, nixos-26.05]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@v3
      - run: |
          nix build .#trivalent --print-build-logs \
            --override-input nixpkgs github:nixos/nixpkgs/${{ matrix.channel }}
