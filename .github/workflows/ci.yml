name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: DeterminateSystems/determinate-nix-action@v3

      - name: Attic cache (cache.hydroakri.cc)
        uses: ryanccn/attic-action@5635a15ef0c5462194ffbd05d1daeddc74625c3a # v0.5.0
        with:
          endpoint: https://cache.hydroakri.cc
          cache: cachix
          token: ${{ secrets.ATTIC_TOKEN }}

      - name: LanTian read-only substituter
        run: |
          mkdir -p ~/.config/nix
          {
            echo "extra-substituters = https://attic.xuyh0120.win/lantian"
            echo "extra-trusted-public-keys = lantian:EeAUQ+W+6r7EtwnmYjeVwx5kOGEBpjlBfPlzGlTNvHc="
          } >> ~/.config/nix/nix.conf

      # the merge gate: pure 3-layer verification (checks.supply-chain) +
      # nixpkgs-drift installCheckPhase (checks.trivalent) + formatting
      - run: nix flake check --print-build-logs

      - run: nix build .#trivalent .#supply-chain --print-build-logs

      # independent review layer -- fingerprint drift (R1) + trusted-root pin (R4)
      - run: ./verify/40-review.sh

      # push the verified closure so consumers substitute instead of rebuild
      - name: Attic push (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          nix build .#trivalent .#supply-chain --print-out-paths --no-link \
            | xargs attic push cachix
