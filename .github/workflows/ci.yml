name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: DeterminateSystems/determinate-nix-action@v3

      # the merge gate: pure 3-layer verification (checks.supply-chain) +
      # nixpkgs-drift installCheckPhase (checks.trivalent) + formatting
      - run: nix flake check --print-build-logs

      - run: nix build .#trivalent .#supply-chain --print-build-logs

      # independent review layer -- fingerprint drift (R1) + trusted-root pin (R4)
      - run: ./verify/40-review.sh

  # Non-blocking signal: does .#trivalent build against nixpkgs other than the
  # one in flake.lock? NOT a required check -- the primary target is
  # unstable-following consumers and glibcStrategy = "fedora-rpm" is
  # nixpkgs-version-independent. `nixos-unstable` here is HEAD (ahead of the
  # lock -> catches drift a day before update-flake-lock.yml); the stable
  # channel is the release-following consumer path (bump at each NixOS release).
  matrix-nixpkgs:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        channel: [nixos-unstable, nixos-26.05]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@v3
      - run: |
          nix build .#trivalent --print-build-logs \
            --override-input nixpkgs github:nixos/nixpkgs/${{ matrix.channel }}
