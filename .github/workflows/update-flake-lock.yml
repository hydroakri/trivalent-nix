name: update-flake-lock

# Keeps the flake's own flake.lock (nixpkgs, treefmt-nix) fresh so `checks`
# evaluate against current nixpkgs. The nixpkgs-drift gate is
# lib/mk-trivalent.nix installCheckPhase (transitive closure + LD_BIND_NOW
# load) -- a glib/mesa/nss/glibc soname or symbol break fails the build, the PR
# goes red, and the rollback block keeps the old lock.
#
# Consumers who `inputs.nixpkgs.follows` don't depend on this.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

concurrency:
  group: update-flake-lock
  cancel-in-progress: true

permissions:
  contents: read

env:
  GH_TOKEN: ${{ secrets.GH_TOKEN_FOR_UPDATES }}

jobs:
  update-flake-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Require GH_TOKEN_FOR_UPDATES
        run: |
          [ -n "$GH_TOKEN" ] || {
            echo "::error::secret GH_TOKEN_FOR_UPDATES is not set -- this workflow cannot open/merge PRs. See the workflow header."
            exit 1
          }

      - run: |
          gh auth setup-git
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: DeterminateSystems/determinate-nix-action@v3

      - name: Upstream channel health
        id: health
        run: |
          v="$(curl -sf 'https://prometheus.nixos.org/api/v1/query?query=hydra_job_failed%7Bchannel%3D%22nixos-unstable%22%7D' \
              | jq -r '.data.result[0].value[1] // ""')"
          if [ -n "$v" ] && [ "$v" != "0" ]; then
            echo "nixos-unstable is broken (hydra_job_failed=$v) -- skipping"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Staleness -- does anything that affects .#trivalent move?
        id: stale
        if: steps.health.outputs.go == 'true'
        run: |
          before="$(nix eval --raw .#packages.x86_64-linux.trivalent.drvPath)"
          nix flake update
          after="$(nix eval --raw .#packages.x86_64-linux.trivalent.drvPath)"
          if [ "$before" = "$after" ]; then
            echo "trivalent drv unchanged -- reverting the lock bump"
            git checkout -- flake.lock
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Working-tree guard + validate
        if: steps.stale.outputs.go == 'true'
        run: |
          if git status --porcelain | grep -vE '^ M flake\.lock$'; then
            echo "::error::unexpected working-tree changes after nix flake update"
            git checkout -- . ; exit 1
          fi
          # Formatter drift is not a regression in THIS repo: a bumped
          # treefmt-nix/nixpkgs can change what shfmt/nixfmt emit (it did: the
          # shfmt default indent flipped to tabs and red-lined this job for days).
          # Re-format with the NEW formatter and let the PR carry the whitespace
          # change; CI still gates the result. Allow-list: *.nix / *.sh only, and
          # never the trust anchors -- anything else aborts for a human.
          nix fmt
          if git status --porcelain | grep -vE '^ M (flake\.lock|.*\.(nix|sh))$' \
            || git status --porcelain | grep -E '^ M (pins\.nix|verify/logs/|verify/repodata/)'; then
            echo "::error::formatter touched files outside its allow-list"
            git checkout -- . ; exit 1
          fi
          nix flake check --print-build-logs
          nix build .#trivalent --print-build-logs

      - name: Open PR
        id: pr
        if: steps.stale.outputs.go == 'true'
        run: |
          BR="bot/flake-lock-$(date +%Y%m%d)"
          git push origin --delete "$BR" 2>/dev/null || true
          git checkout -B "$BR"
          git add -u   # flake.lock + anything `nix fmt` re-formatted (allow-listed above)
          if git diff --cached --name-only | grep -qvx flake.lock; then
            msg="flake.lock: update (+ reformat for updated formatters)"
            note=" Also re-formatted with the updated formatters (whitespace only): $(git diff --cached --name-only | grep -vx flake.lock | tr '\n' ' ')"
          else
            msg="flake.lock: update"
            note=""
          fi
          git commit -m "$msg"
          git push -u origin "$BR"
          PR="$(gh pr create --base main --head "$BR" --title "$msg" \
            --label automated --label dependencies \
            --body "Passed \`nix flake check\` + \`nix build .#trivalent\` (drift installCheckPhase).$note")"
          echo "pr_number=$(gh pr view "$PR" --json number --jq .number)" >> "$GITHUB_OUTPUT"
          echo "branch=$BR" >> "$GITHUB_OUTPUT"

      - name: Wait for CI, merge or roll back
        if: steps.pr.outputs.pr_number != ''
        run: |
          PR="${{ steps.pr.outputs.pr_number }}"
          BR="${{ steps.pr.outputs.branch }}"
          for _ in $(seq 60); do gh pr checks "$PR" >/dev/null 2>&1 && break || sleep 10; done
          if timeout 21600 gh pr checks "$PR" --watch --interval 60; then
            ok=false
            for _ in 1 2 3; do
              gh pr merge "$PR" --squash --delete-branch && { ok=true; break; } || sleep 30
            done
            [ "$ok" = true ] || { echo "::error::merge kept failing -- PR $PR left open"; exit 1; }
          else
            echo "::error::CI failed or timed out -- rolling back"
            gh pr close "$PR" --comment "CI red; closing. main keeps the previous flake.lock."
            git push origin --delete "$BR" 2>/dev/null || true
            exit 1
          fi

      # A red scheduled run used to be invisible: the lock silently stopped
      # moving for 5 days. Open (or update) ONE issue while it keeps failing and
      # close it when a lock bump merges again.
      - name: Alert -- update-flake-lock is failing
        if: failure()
        run: |
          title="update-flake-lock is failing"
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          num="$(gh issue list --state open --label blocked --search "in:title \"$title\"" --json number --jq '.[0].number')"
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "Still failing on $(date -u +%FT%TZ): $url"
          else
            gh issue create --title "$title" --label blocked \
              --body "The scheduled flake.lock update failed, so main's flake.lock is not moving. Run: $url"
          fi

      - name: Clear alert -- a lock bump merged
        if: success() && steps.pr.outputs.pr_number != ''
        run: |
          title="update-flake-lock is failing"
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          num="$(gh issue list --state open --label blocked --search "in:title \"$title\"" --json number --jq '.[0].number')"
          [ -z "$num" ] || gh issue close "$num" --comment "Recovered: a flake.lock update merged ($url)."
